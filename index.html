<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen">

   
    <nav class="bg-gray-900 text-white py-4 px-6 shadow-md">
        <h1 class="text-lg font-medium">Personal Expense Tracker</h1>
    </nav>

    <div class="max-w-6xl mx-auto px-4 py-6">
        
        
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Financial Dashboard</h2>
            <p class="text-sm text-gray-500">Manage your income and expenses in one place.</p>
        </div>

        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                <p class="text-xs text-gray-500 font-medium mb-1">Total Income</p>
                <p id="total-income" class="text-2xl font-bold text-gray-900">LKR 0.00</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                <p class="text-xs text-gray-500 font-medium mb-1">Total Expenses</p>
                <p id="total-expenses" class="text-2xl font-bold text-gray-900">LKR 0.00</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                <p class="text-xs text-gray-500 font-medium mb-1">Current Balance</p>
                <p id="current-balance" class="text-2xl font-bold text-gray-900">LKR 0.00</p>
            </div>
        </div>

        
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 mb-8">
            <h3 class="text-base font-bold text-gray-800 mb-4">Add a Transaction</h3>
            
            <form id="transaction-form" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Transaction Type</label>
                    <select id="type" class="w-full p-2.5 bg-white border border-gray-300 rounded-md text-sm focus:outline-none focus:border-blue-500">
                        <option value="Income">Income</option>
                        <option value="Expense">Expense</option>
                    </select>
                </div>

                
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Description</label>
                    <input type="text" id="description" placeholder="e.g. Monthly allowance" required class="w-full p-2.5 border border-gray-300 rounded-md text-sm focus:outline-none focus:border-blue-500">
                </div>

                
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Amount (LKR)</label>
                    <input type="number" id="amount" step="0.01" placeholder="Enter amount" required class="w-full p-2.5 border border-gray-300 rounded-md text-sm focus:outline-none focus:border-blue-500">
                </div>

                
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Category</label>
                    <select id="category" class="w-full p-2.5 bg-white border border-gray-300 rounded-md text-sm focus:outline-none focus:border-blue-500">
                        <option value="">Select a category</option>
                        <option value="Allowance">Allowance</option>
                        <option value="Salary">Salary</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Education">Education</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Transaction Date</label>
                    <input type="date" id="date" required class="w-full md:w-1/2 p-2.5 border border-gray-300 rounded-md text-sm focus:outline-none focus:border-blue-500">
                </div>

                
                <div class="md:col-span-2 flex items-center gap-3 pt-2">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2 rounded-md text-sm transition">Add Transaction</button>
                    <button type="button" id="clear-btn" class="bg-white hover:bg-gray-50 text-gray-700 border border-gray-300 font-medium px-4 py-2 rounded-md text-sm transition">Clear Form</button>
                </div>
            </form>
        </div>

        
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
            <h3 class="text-base font-bold text-gray-800 mb-4">Transaction History</h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Filter by Type</label>
                    <select id="filter-type" class="w-full p-2.5 bg-white border border-gray-300 rounded-md text-sm focus:outline-none focus:border-blue-500">
                        <option value="All">All Transactions</option>
                        <option value="Income">Income Only</option>
                        <option value="Expense">Expense Only</option>
                    </select>
                </div>

                
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Search Transactions</label>
                    <input type="text" id="search-box" placeholder="Search by description or category" class="w-full p-2.5 border border-gray-300 rounded-md text-sm focus:outline-none focus:border-blue-500">
                </div>
            </div>

            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-200 text-xs font-bold text-gray-600 uppercase">
                            <th class="py-3 px-4">Date</th>
                            <th class="py-3 px-4">Description</th>
                            <th class="py-3 px-4">Type</th>
                            <th class="py-3 px-4">Category</th>
                            <th class="py-3 px-4">Amount (LKR)</th>
                            <th class="py-3 px-4">Action</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-list" class="text-sm text-gray-700">
                        
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
